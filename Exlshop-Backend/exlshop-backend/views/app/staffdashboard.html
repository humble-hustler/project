<%- include("./partials/header.html") %>
<%- include("./partials/topnav.html") %>
<%- include("./partials/sidebar.html") %>
<div class="page">
  <div class="page-content">
      <div class="panel">
          <div class="panel-body">
              <table class="table table-hover dataTable table-striped w-full mt-10" id="self-list">
                  <thead>
                      <tr>
                          <th>Name</th>
                          <th>Email</th>
                          <th>Phone</th>
                          <th>Role</th>
                          <th>Department</th>
                          <th>Designation</th>
                          <th>Status</th>
                          <th>Profile Status</th>
                      </tr>
                  </thead>                    
                  <tbody></tbody>
              </table>
          </div>
      </div>       
  </div>
</div>
<div class="modal fade" id="filter" aria-hidden="false" aria-labelledby="filter" role="dialog" tabindex="-1">
  <div class="modal-dialog modal-simple">
      <div class="modal-content">
          <div class="modal-header">
              <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                  <span aria-hidden="true">×</span>
              </button>
              <h4 class="modal-title">Filters</h4>
          </div>
          <div class="modal-body">
              <div class="row">
                  <div class="form-group col-xl-6">
                      <label class="form-control-label">From</label>
                      <input type="text" class="form-control" id="from" name="from_date" />
                  </div>
                  <div class="form-group col-xl-6">
                      <label class="form-control-label">To</label>
                      <input type="text" class="form-control" id="to" name="to_date" />
                  </div>
                  <div class="form-group col-xl-6">
                      <label class="form-control-label">Gender</label>
                      <select class="form-control" id="gender" name="gender">
                          <option value="">All</option>
                          <option value="M">Male</option>
                          <option value="F">Female</option>
                      </select>
                  </div>
                  <div class="form-group col-xl-6">
                      <label class="form-control-label">Source</label>
                      <select class="form-control" id="source" name="source">
                          <option value="">All</option>
                      </select>
                  </div>
                  <div class="form-group col-xl-6">
                      <label class="form-control-label">Status</label>
                      <select class="form-control" id="status" name="status">
                          <option value="">All</option>
                      </select>
                  </div>
                  <div class="form-group col-xl-6">
                      <label class="form-control-label">Lead Owner</label>
                      <select class="form-control" id="team" name="team">
                          <option value="">All</option>
                      </select>
                  </div>
                  <div class="form-group col-xl-12 text-right">
                      <%- csrf_html %>
                      <button class="btn btn-primary" id="apply-filter">Apply</button>
                  </div>
              </div>
          </div>
      </div>
  </div>
</div>
<!-- End Page -->
<%- include("./partials/footer.html") %>
<script type="text/javascript">
       VIEW_USERS.init({
        _csrf: '<%= _csrf %>',
        flash: '<%= messages.error %>'
    })
</script>
