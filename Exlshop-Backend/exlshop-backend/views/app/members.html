<%- include("./partials/header.html") %>
<%- include("./partials/topnav.html") %>
<%- include("./partials/sidebar.html") %>
<div class="page">
    <div class="page-content">
        <div class="panel">            
            <div class="panel-heading">
                <h3 class="panel-title">Members</h3>
            </div>
            <div class="panel-body">
                <table class="table table-hover dataTable table-striped w-full" id="members-list">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Phone</th>
                            <th>Email</th>
                            <th>Gender</th>                       
                            <th>Birth Date</th>
                            <th>Joining Date</th>
                            <th>Expiry Date</th>
                            <th>Status</th>
                        </tr>
                    </thead>                    
                    <tbody></tbody>
                </table>
            </div>
        </div>       
    </div>
</div>
<div class="modal fade" id="add-new-member" aria-hidden="false" aria-labelledby="add-new-member" role="dialog" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">×</span>
                </button>
                <h4 class="modal-title" id="add-new-team-member">Add New Member</h4>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="form-group col-xl-4">
                        <input type="text" class="form-control" id="user-fname" name="user_fname" placeholder="First Name" required />
                    </div>
                    <div class="form-group col-xl-4">
                        <input type="text" class="form-control" id="user-lname" name="user_lname" placeholder="Last Name" required />
                    </div>
                    <div class="form-group col-xl-4">
                        <input type="text" class="form-control" id="user-email" name="user_email" placeholder="Email" required />
                        <div class="invalid-feedback"></div>
                    </div>
                    <div class="form-group col-xl-4">
                        <input type="text" class="form-control" id="user-phone" name="user_phone" placeholder="Phone" required />
                        <div class="invalid-feedback"></div>
                    </div>
                    <div class="form-group col-xl-4">
                        <input type="text" class="form-control" id="user-dob" name="user_dob" placeholder="DOB" required />
                        <div class="invalid-feedback"></div>
                    </div>
                    <div class="form-group col-xl-4">
                        <input type="text" class="form-control" id="user-anniversary" name="user_anniversary" placeholder="Anniversary Date" required />
                        <div class="invalid-feedback"></div>
                    </div>
                    <div class="form-group col-xl-6">
                        <label class="form-control-label">Gender</label><br>
                        <div>
                            <div class="radio-custom radio-primary radio-inline">
                                <input type="radio" class="gender-radio" id="gender-male" name="gender" value="M">
                                <label for="gender-male">Male</label>
                            </div>
                            <div class="radio-custom radio-primary radio-inline">
                                <input type="radio" class="gender-radio" id="gender-female" name="gender" value="F">
                                <label for="gender-female">Female</label>
                            </div>
                        </div> 
                    </div>
                    <div class="form-group col-xl-6">
                        <label class="form-control-label">Marital Status</label><br>
                        <div>
                            <div class="radio-custom radio-primary radio-inline">
                                <input type="radio" class="marital-status-radio" id="marital-status-married" name="marital_status" value="1">
                                <label for="marital-status-married">Married</label>
                            </div>
                            <div class="radio-custom radio-primary radio-inline">
                                <input type="radio" class="marital-status-radio" id="marital-status-single" name="marital_status" value="2">
                                <label for="marital-status-single">Single</label>
                            </div>
                        </div> 
                    </div>
                    <div class="form-group col-xl-6">
                        <input type="text" class="form-control" id="address-1" name="address_line_1" placeholder="Address Line 1" required />
                        <div class="invalid-feedback"></div>
                    </div>
                    <div class="form-group col-xl-6">
                        <input type="text" class="form-control" id="address-2" name="address_line_2" placeholder="Address Line 2" required />
                        <div class="invalid-feedback"></div>
                    </div>
                    <div class="form-group col-xl-4">
                        <input type="text" class="form-control " id="emergency-contact-name" name="emergency_contact_name" placeholder="Emergency Contact Name" >
                    </div>
                    <div class="form-group col-xl-4">
                        <input type="text" class="form-control " id="emergency-contact-number" name="emergency_contact_number" placeholder="Emergency Contact Phone">
                    </div>
                    <div class="form-group col-xl-4">
                        <select class="form-control edit-data" id="blood-group" name="blood_group" placeholder="Blood Group">
                            <option value="">--Select Blood Group--</option>
                            <option >A+ve</option>
                            <option >A-ve</option>
                            <option >B+ve</option>
                            <option >B-ve</option>
                            <option >AB+ve</option>
                            <option >AB-ve</option>
                            <option >O+ve</option>
                            <option >O-ve</option>
                        </select>
                    </div>
                    <div class="form-group col-xl-4">
                        <select class="form-control" id="state-select" name="user_state">
                            <option value="">Select State</option>
                            <% states.forEach((s)=>{ %>
                            <option value="<%= s.id %>"><%= s.name %></option>
                            <% }) %>
                        </select>
                        <div class="invalid-feedback"></div>
                    </div>
                    <div class="form-group col-xl-4">
                        <select class="form-control" id="city-select" name="user_city">
                            <option value="">Select City</option>                            
                        </select>
                        <div class="invalid-feedback"></div>
                    </div>
                    <div class="form-group col-xl-4">
                        <input type="text" class="form-control" id="user-zip" name="user_zip" placeholder="ZIP Code" required />
                        <div class="invalid-feedback"></div>
                    </div>
                    <div class="form-group col-xl-12">
                        <%- csrf_html %>
                        <button class="btn btn-primary" id="add-member-btn">Add Member</button>
                    </div>
                </div>                
            </div>            
        </div>
    </div>
</div>
<%- include("./partials/footer.html") %>
<script type="text/javascript">
    VIEW_MEMBERS.init({
        _csrf: '<%= _csrf %>'
    })
</script>
