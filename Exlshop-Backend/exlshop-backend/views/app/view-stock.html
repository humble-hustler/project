<%- include("./partials/header.html") %>
<%- include("./partials/topnav.html") %>
<%- include("./partials/sidebar.html") %>
<style>
   #stock
   {
    color: #fff;
   }
   .tab-content
   {
    background-color: white;
    padding: 20px 10px;
    border-radius: 3px;
   }
</style>
            <div class="page">
                <div class="page-header">              
                    <ul class="nav nav-tabs nav-tabs-line tabs-line-top mb-10" role="tablist">
                        <h3>View Stock</h3>
                        <!-- <li class="nav-item" role="presentation"><a class="nav-link " data-toggle="tab"
                                href="#Out-of-Stock" aria-controls="personal-details" role="tab"
                                title="Personal Details">
                                <h4 aria-hidden="true">Out Of Stock</h4>
                            </a></li> -->
                    </ul>
                    <div class="tab-content">
                        <div class="tab-pane active" id="View-stock" role="tabpanel">
                            <div style="float:right;margin-left: 4cm;" class="resetBtn">
                                <button class="text-dark mr-10" id="reset-filter-btn">Reset Filter <i class="fa fa-times-circle-o"></i></button>
                                <button  class="btn btn-primary" id="filter-btn" data-toggle="modal" data-target="#filter">Filter <i class="fa fa-filter"></i></button>
                            </div>  
                            <a>
                                <button class="btn btn-primary" id="update-stock" data-toggle="modal" >Change Stock Status </button>                              
                            </a>               
                            <br>
                            <br>
                            <table class="table table-hover dataTable table-striped w-full" id="stock-list">
                                <thead>
                                    <tr> 
                                        <th>Id</th>
                                        <th>Product Image</th>    
                                        <th>Product Name</th>
                                        <th>Category</th>
                                        <th>Quantity</th>
                                        <th>Returned</th>
                                        <th>Cancelled</th>
                                        <th>Status</th>
                                        <th>Select</th>
                                    </tr>
                                </thead>
                                <tbody></tbody>
                            </table>
                        </div>
                        <!-- <div class="tab-pane " id="Out-of-Stock" role="tabpanel">
                            
                            <table class="table table-hover dataTable table-striped w-full" id="outofstock-list">
                                <thead>
                                    <tr>
                                        <th>Product Id</th> 
                                        <th>Product Name</th>
                                        <th>Category Name</th>
                                    </tr>
                                </thead>
                                <tbody></tbody>
                            </table>
                        </div> -->
                    </div>
                </div>
            </div>
            <div class="modal fade" id="filter" aria-hidden="false" aria-labelledby="filter" role="dialog" tabindex="-1">
                <div class="modal-dialog modal-simple">
                    <div class="modal-content">
                        <div class="modal-header">
                            <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                                <span aria-hidden="true">×</span>
                            </button>
                            <h4 class="modal-title">Filters</h4>
                        </div>
                        <div class="modal-body">
                            <div class="row">
                              
                                <div class="form-group col-xl-4">
                                    <label class="form-control-label">Product Name</label>
                                    <input class="form-control" id="product_id" name="product_name">
                                </div>
                                <div class="form-group col-xl-4">
                                    <label class="form-control-label">Quantity</label>
                                    <input class="form-control" id="quantity_id" name="quantity_name">
                                </div>
                                <div class="form-group col-xl-4">
                                    <label class="form-control-label">Stock Status</label>
                                    <select class="form-control" id="status_id" name="status_name">
                                        <option disabled selected value>----Select Option----</option>
                                        <option  value="0">Out Of Stock </option>
                                        <option value="1">In Stock </option>
                                    </select>
                                </div>
                                <div class="form-group col-xl-4">
                                    <label class="form-control-label">Category</label>
                                    <select class="form-control" id="filter_category_id" name="filter_categoryname">
                                        <option disabled selected value> -- select an option -- </option>
                                        <% categories.forEach((c)=>{ %>
                                            <option value="<%= c.id %>">
                                                <%= c.name %>
                                            </option>
                                            <% }) %>
                                    </select>
                                </div>
                                <div class="form-group col-xl-4">
                                    <label class="form-control-label">SubCategory</label>
                                    <select class="form-control" id="filter_subcategory_id" name="filter_subcategoryname">
                                        <option disabled selected value> -- select an option -- </option>
                                    </select>
                                </div>
                                <div class="form-group col-xl-4">
                                    <label class="form-control-label">Sub-SubCategory</label>
                                    <select class="form-control" id="filter_subsubcategory_id" name="filter_subsubcategoryname">
                                        <option disabled selected value> -- select an option -- </option>
                                    </select>
                                </div>
                                <div class="form-group col-xl-12 text-right">
                                    <%- csrf_html %>
                                    <button class="btn btn-primary" id="apply-filter">Apply</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>   
          
<%- include("./partials/footer.html") %>
<script type="text/javascript">
VIEW_STOCK.init({
 _csrf: '<%= _csrf %>',
  products : '<%- products %>'
  })
</script>
