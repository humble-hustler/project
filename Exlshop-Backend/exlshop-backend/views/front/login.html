<!DOCTYPE html>
<html class="no-js css-menubar" lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0, minimal-ui">

    <title>Login</title>

    <link rel="stylesheet" href="/global/css/bootstrap.min.css">
    <link rel="stylesheet" href="/global/css/bootstrap-extend.min.css">
    <link rel="stylesheet" href="/css/site.min.css">
    <link rel="stylesheet" href="/css/login.css">

    <!--[if lt IE 9]>
        <script src="/global/vendor/html5shiv/html5shiv.min.js"></script>
        <![endif]-->

    <!--[if lt IE 10]>
        <script src="/global/vendor/media-match/media.match.min.js"></script>
        <script src="/global/vendor/respond/respond.min.js"></script>
        <![endif]-->

    <!-- Scripts -->
    <script src="/global/vendor/breakpoints/breakpoints.js"></script>
    <script>
        Breakpoints();
    </script>
    <style>
        .toast.toast-error{
            position: absolute;
            top:50px;
            right:20px;
            background: red;
            opacity: 1;
            padding: 10px;
            border-radius: 5px;
        }
        .btn-sign-up{
            margin-top: 10px;
            margin-bottom: 10px;
            width: 100%;
        }
    </style>
</head>

<body class="animsition page-login layout-full page-dark">
    <div class="page vertical-align text-right" style="right:200px;">
        <div class="page-content vertical-align-middle" style="background:rgba(255,255,255,0.7);">
            <% if(messages.error) { %>
                <%= messages.error %>
                    <% } %>
                        <div class="brand">
                            <img class="brand-img" style="width: 300px;" src="/images/logo.png" />
                        </div>
                        <!-- <form method="post" action="/login">                     -->
                        <div class="form-group">
                            <label class="sr-only" for="email">Email</label>
                            <input type="email" class="form-control" id="email" name="email" placeholder="Email"
                                autocomplete="username">
                        </div>
                        <div class="form-group">
                            <label class="sr-only" for="password">Password</label>
                            <input type="password" class="form-control" id="password" name="password"
                                placeholder="Password" autocomplete="current-password">
                        </div>
                        <%- csrf_html %>
                            <button type="submit" class="btn btn-danger btn-block">Login</button>
                          <a href="http://139.59.33.170:3331">  <button type="submit" class="btn btn-danger btn-sign-up">Sign Up</button></a>
                            <!-- </form> -->
                            <div class="form-group clearfix">
                                <a class="btn btn-primary" data-target="#forgotPassword" data-toggle="modal">
                                    <span class="hidden-sm-down">Forgot password?</span>
                                </a>
                            </div>
                          
                            <div class="modal fade" id="forgotPassword" aria-hidden="false"
                                aria-labelledby="forgotPassword" role="dialog" tabindex="-1">
                                <div class="modal-dialog modal-simple">
                                    <div class="modal-content">
                                        <div class="modal-header">
                                            <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                                                <span aria-hidden="true">×</span>
                                            </button>
                                            <h4 class="modal-title">Forgot Password</h4>
                                        </div>
                                        <div class="modal-body">
                                            <div class="row">
                                                <div class="form-group col-xl-6">
                                                    <input type="text" class="form-control" id="email_id" name="emailId"
                                                        placeholder="Enter Email" required />
                                                </div>
                                                <div class="form-group col-xl-12">
                                                    <%- csrf_html %>
                                                        <button class="btn btn-primary" id="verification-btn">Send
                                                            Verification Email</button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
        </div>
    </div>

    <script src="/global/vendor/babel-external-helpers/babel-external-helpers.js"></script>
    <script src="/global/vendor/jquery/jquery.js"></script>
    <script src="/global/vendor/bootstrap/bootstrap.js"></script>
   <script src="/global/vendor/toastr/toastr.min.js"></script>
    <styles src="/global/vendor/datatables.net-bs4/dataTables.bootstrap4.css"></style>
        <styles src="/global/vendor/datatables.net-bs4/dataTables.bootstrap4.css"></style>
        <style src="/global/vendor/toastr/toastr.min.css"></style>
    <script>
        $(function () {
            $(".btn-block").click(function (e) {
                var email = $("#email").val();
                var password = $("#password").val();
                $.ajax({
                    //   url:'/api/v1/index1/login',
                    url: "/login",
                    data: {
                        _csrf: '<%= _csrf %>',
                        email: email,
                        password: password
                    },

                    method: 'POST',
                   
                    success : function(data){
                        if(data.err){
                            toastr.error('Please Enter Valid Email Id Or Password..')
                        }
                        else{
                            window.location = "/";
                        }
                    }
                });
            });

            $("#verification-btn").click(function (e) {
                var email = $("#email_id").val();
                alert(email)
                $.ajax({
                    url: "/verification-email-send",
                    //  url: "/sign-in",
                    data: {
                        email: email,
                        _csrf: '<%= _csrf %>'
                    },
                    method: 'POST',
                    success: function (data) {
                        window.location = "/";
                    },
                    error: function (data, status, error) {
                    }
                });
            });
        
         
        
        
        })
    </script>
</body>

</html>
