<!DOCTYPE html>
<html class="no-js css-menubar" lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0, minimal-ui">

        <title>Login</title>

        <link rel="stylesheet" href="/global/css/bootstrap.min.css">
        <link rel="stylesheet" href="/global/css/bootstrap-extend.min.css">
        <link rel="stylesheet" href="/css/site.min.css">        
        <link rel="stylesheet" href="/css/login.css">

        <!--[if lt IE 9]>
        <script src="/global/vendor/html5shiv/html5shiv.min.js"></script>
        <![endif]-->

        <!--[if lt IE 10]>
        <script src="/global/vendor/media-match/media.match.min.js"></script>
        <script src="/global/vendor/respond/respond.min.js"></script>
        <![endif]-->

        <!-- Scripts -->
        <script src="/global/vendor/breakpoints/breakpoints.js"></script>
        <script>
            Breakpoints();
        </script>
    </head>
    <body class="animsition page-login layout-full page-dark">
        <div class="page vertical-align text-right" style="right:200px;">
            <div class="page-content vertical-align-middle" style="background:rgba(255,255,255,0.7);">
                <% if(messages.error) { %>
                <%= messages.error %>
                <% } %>
                <div class="brand">
                    <img class="brand-img" style="width: 300px;" src="/images/logo.png" />
                </div>
                <div class="form-group">
                    <input type="hidden" class="form-control" id="token_id" name="tokenId" value="<%= token %>" autocomplete="current-password">
                </div>
                    <div class="form-group">
                        <label class="sr-only" for="password">Password</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Password" autocomplete="current-password">
                    </div>
                    <div class="form-group">
                        <label class="sr-only" for="password">Confirm Password</label>
                        <input type="password" class="form-control" id="confirm-password" name="password" placeholder="Password" autocomplete="current-password">
                        <p style="margin-top: 10px; color: red; float: left; margin-left: 10px;"></p>
                    </div>
                    <%- csrf_html %>
                    <button type="submit" class="btn btn-danger PasswordSet-button" style="margin-top: 10px;" disabled>Set Password</button>
            </div>
        </div>
        <script src="/global/vendor/babel-external-helpers/babel-external-helpers.js"></script>
        <script src="/global/vendor/jquery/jquery.js"></script>
        <script src="/global/vendor/bootstrap/bootstrap.js"></script>
        <script>
        $(function(){	
            
            $("#confirm-password").on('keyup', function (){
                const pass = $("#password").val()
                
                if(pass == $(this).val()){
                    $(".PasswordSet-button").attr("disabled", false)
                    $("#confirm-password").next('p').text('')
                    
                }else{
                    $(".PasswordSet-button").attr("disabled", true)
                    $("#confirm-password").next('p').text('Password does not match.')
                }
                
            })
            
            
          $(".PasswordSet-button").click(function(e){
              var password=$("#password").val();  
              var token=$("#token_id").val();
              $.ajax({
              //   url:'/api/v1/index1/login',
                url: "/update-password",
                  data:{
                    _csrf: '<%= _csrf %>',
                       password:password,
                       token:token
                    },	
                       
                        method: 'POST',					
                        success: function(data) {
                        toastr.success('password updated successfully!');
                        window.location = "/";
                         },
                        error: function(data,status,error) {
                        toastr.error('Some error occurred')
                         }
              });			
          });				
      });

        </script>
    </body>
</html>
