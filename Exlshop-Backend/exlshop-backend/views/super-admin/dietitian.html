<%- include("./partials/header.html") %>
<%- include("./partials/topnav.html") %>
<%- include("./partials/sidebar.html") %>
<div class="page">
    <div class="page-header">
        <h1 class="page-title">Dietician</h1>        
        <div class="page-header-actions">
            <button class="btn btn-round btn-primary" data-target="#add-new-dietician" data-toggle="modal"  id="">
                <i class="icon fa-plus" aria-hidden="true"></i>
                <span class="hidden-sm-down">Add New Dietician</span>
            </button>
        </div>
    </div>

    <div class="page-content">
        <div class="panel">            
            <div class="panel-body">
                <table class="table table-hover dataTable table-striped w-full" id="dietician-list">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>    
                        </tr>
                    </thead>                    
                    <tbody></tbody>
                </table>
            </div>
        </div>       
    </div>
</div>
<div class="modal fade" id="add-new-dietician" aria-hidden="false" aria-labelledby="add-new-dietician" role="dialog" tabindex="-1">
    <div class="modal-dialog modal-simple">
        <form class="modal-content" action="/super-admin/settings/dietitian/add" method="POST" autocomplete="off" id="dietician-form">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">×</span>
                </button>
                <h4 class="modal-title" id="add-new-dietician">Add New Dietician</h4>
            </div>
            <div class="modal-body">
                <input type="hidden" id="update-dietician-id" name="update_dietician_id">
                <div class="row ">
                    <div class="form-group col-xl-6">
                        <input type="text" class="form-control form-elements" id="dietician-fname" name="dietician_fname" placeholder="First Name" required />
                    </div>
                    <div class="form-group col-xl-6">
                        <input type="text" class="form-control form-elements" id="dietician-lname" name="dietician_lname" placeholder="Last Name" required />
                    </div>
                    <div class="form-group col-xl-6">
                        <input type="text" class="form-control form-elements" id="dietician-email" name="dietician_email" placeholder="Email" required />
                        <div class="invalid-feedback"></div>
                    </div>
                    <div class="form-group col-xl-6">
                        <input type="text" class="form-control form-elements" id="dietician-phone" name="dietician_phone" placeholder="Phone" required />
                        <div class="invalid-feedback"></div>
                    </div>
                    <div class="form-group col-xl-6">
                        <input type="password" class="form-control form-elements" id="dietician-password" name="dietician_password" placeholder="Password" autocomplete="new-password" required />
                    </div>
                    <div class="form-group col-xl-6">
                        <input type="password" class="form-control form-elements" id="dietician-confirm-password" name="dietician_confirm_password" placeholder="Confirm Password" autocomplete="new-password" required />
                        <div class="invalid-feedback" id="password-mismatch">Passwords do not match</div>
                    </div>
                    <div class="form-group col-xl-12">
                        <%- csrf_html %>
                        <button class="btn btn-primary" id="add-new-dietician-btn">Add</button>
                    </div>
                </div>                
            </div>            
        </form>
    </div>
</div>
<%- include("./partials/footer.html") %>
<script type="text/javascript">
    DIETICIANS.init({
        _csrf: '<%= _csrf %>'
    })
</script>
