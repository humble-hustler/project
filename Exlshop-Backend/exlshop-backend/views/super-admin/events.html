<%- include("./partials/header.html") %>
<%- include("./partials/topnav.html") %>
<%- include("./partials/sidebar.html") %>
<div class="page">
    <div class="page-content">
        <div class="panel">            
            <div class="panel-heading">
                <h3 class="panel-title">Events</h3>
                <div class="panel-actions text-white">
                    <a class="btn btn-primary" data-target="#add-new-event" data-toggle="modal">                        
                        <span class="hidden-sm-down">Add New Event</span>
                        <i class="icon fa-plus" aria-hidden="true"></i>
                    </a>
                </div>
            </div>
            <div class="panel-body">
                <table class="table table-hover dataTable table-striped w-full" id="event-list">
                    <thead>
                        <tr>
                            <th><i class="fa fa-image"></i></th>
                            <th>Name</th>
                            <th>Type</th>
                            <th>Start Date</th> 
                            <th>End Date</th> 
                            <th>Held By</th>  
                            <th>Charges</th>              
                        </tr>
                    </thead>                    
                    <tbody></tbody>
                </table>
            </div>
        </div>       
    </div>
</div>

<div class="modal fade" id="add-new-event" aria-hidden="false" aria-labelledby="add-new-event" role="dialog" tabindex="-1">
    <div class="modal-dialog modal-simple">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">×</span>
                </button>
                <h4 class="modal-title">Add New Event</h4>
            </div>
            <div class="modal-body">
                <form action="/super-admin/events/add" method="POST" enctype="multipart/form-data">
                    <div class="row">
                        <div class="form-group col-xl-6">
                            <input type="text" class="form-control" id="event-name" name="event_name" placeholder="Event Name" required />
                        </div>
                        <div class="form-group col-xl-6">
                            <select class="form-control" id="event-type" name="event_type" placeholder="Event Type" required >
                                <option>Select Type</option>
                                <% types.forEach(function (t){ %>
                                <option value="<%= t.id %>" ><%= t.type %></option>
                                <% })%>
                            </select>
                        </div>
                        <div class="form-group col-xl-6">
                            <label class="form-control-label">Start Date</label>
                            <input type="text" name="start_date" id="start-date" class="form-control">
                        </div>
                        <div class="form-group col-xl-6">
                            <label class="form-control-label">End Date</label>
                            <input type="text" name="end_date" id="end-date" class="form-control">
                        </div>
                        <div class="form-group col-xl-6">
                            <label class="form-control-label">Held By</label>
                            <input type="text" name="held_by" id="held-by" class="form-control">
                        </div>
                        <div class="form-group col-xl-6">
                            <label class="form-control-label">Description</label>
                            <textarea type="text" name="description" id="description" class="form-control"></textarea>
                        </div>
                        <div class="form-group col-xl-6">
                            <label class="form-control-label">Banner Image</label>
                            <input type="file" name="banner_img" id="banner-img" class="form-control">
                        </div>
                        <div class="form-group col-xl-6">
                            <label class="form-control-label">Charges</label>
                            <input type="text" name="charges" id="charges" class="form-control">
                        </div>
                        <div class="form-group col-xl-12">
                            <%- csrf_html %>
                            <button class="btn btn-primary" id="add-event-btn">Add Event</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<%- include("./partials/footer.html") %>
<script type="text/javascript">
    VIEW_EVENTS.init({
        _csrf: '<%= _csrf %>'
    })
</script>
