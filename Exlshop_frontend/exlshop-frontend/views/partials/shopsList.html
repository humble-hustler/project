<style>
       .page-number{
      text-align: center;
      user-select: none;
    }
    .page-number li {
      display: inline-block;
      margin: 5px;
    }
    .page-number li a{
      text-decoration: none;
      font-size: 15px;
      line-height: 25px;
    }
    .page-number li:not(.acti) a{
        color: black;
    }
    .previous-page, .next-page{
      background-color: rgb(11, 175, 240);
      cursor: pointer;
    }
    .pagination{
      text-align: center;
      margin: 30px 30px 60px;
      user-select: none;
    }
    .pagination li {
      display: inline-block;
      margin: 5px;
    }
    .pagination li a{
      text-decoration: none;
      font-size: 15px;
      line-height: 25px;
    }
    .acti a{
        background-color: rgb(161, 159, 159);
        color: black;
    }
    .pagination li:not(.acti) a{
        color: black;
    }
    .current-page, .dots{
      background: #ccc;
      cursor: pointer;
      }
</style>
    <% if(shops.length == 0){%>
        <center><h4>No Shop Available </h4></center>
        <% } %>
        <div class="row" style="padding-left: 30px; display: none;" id="main-row">
        <% shops.forEach((p) => { %>
            <div class="column card-group p-2 shopdiv" style="width:25%; margin-left: 3px">
                <div  class="card card-product-grid" style=" border-radius: 10px 10px 0px 0px"> 
                    <img  href="/shop_product/<%= p.brands_id %>/<%=p.location_id %>" src= <%= p.brand_logo ?  p.brand_logo  : `${coreHostname}/images/logo1.png` %> class="m-auto bg-primary" id="shop-image" alt="<%= p.name %>\style=" border-radius: 10px 10px 0px 0px">
                    <figcaption class="info-wrap">  
                       <% if(p.wishlist == 1) { %>
                            <div><i  class="fa fa-bookmark" id="bookmark"></i></div>
                           <% } %>
                           <% if(p.wishlist == 0) { %>
                                <div><i class="bi bi-bookmark" id="bookmark"></i></div>
                                <% } %>
                        <a  href="/shop_product/<%= p.brands_id %>/<%=p.location_id %>">
                        <span class="price mt-1" id="brand-name"><%= p.brands_name %></span></a>     
                        <span class="myrate green" id="myrate" style="float: right; margin: 5px -10px 0px 0px">
                            <%= p.stars %>&nbsp;<i class="bi bi-star-fill ten"></i></span><br>                   
                        <span class="price mt-1 fw-normal" ><%= p.location_name %>/<%=p.location_id %></span><br>
                        <span class="price mt-1 fw-bold">Brand-id :-</span> <span class="price mt-1 fw-normal"  id ="brand_id" value=""> <%=p.brands_id %></span><br>
                        <span class="price mt-1 fw-bold">Brand-location :-</span> <span class="price mt-1 fw-normal"   id ="brand_location_id" value=""> <%=p.location_id %></span><br>
                        <span class="price mt-1 fw-bold">Available Product :-</span>  <span class="price mt-1 fw-normal"> <%= p.count %></span>
                    </figcaption>
                </div>
            </div>
        <% }) %>
    </div>

    <script>
                    function getPageList(totalPages, page, maxLength){
                        function range(start, end){
                          return Array.from(Array(end - start + 1), (_, i) => i + start);
                        }
                        var sideWidth = maxLength < 9 ? 1 : 2;
                        var leftWidth = (maxLength - sideWidth * 2 - 3) >> 1;
                        var rightWidth = (maxLength - sideWidth * 2 - 3) >> 1;
                  
                        if(totalPages <= maxLength){
                          return range(1, totalPages);
                        }
                        if(page <= maxLength - sideWidth - 1 - rightWidth){
                          return range(1, maxLength - sideWidth - 1).concat(0, range(totalPages - sideWidth + 1, totalPages));
                        }
                        if(page >= totalPages - sideWidth - 1 - rightWidth){
                          return range(1, sideWidth).concat(0, range(totalPages - sideWidth - 1 - rightWidth - leftWidth, totalPages));
                        }
                        return range(1, sideWidth).concat(0, range(page - leftWidth, page + rightWidth), 0, range(totalPages - sideWidth + 1, totalPages));
                      }

                      $(document).ready(function(){
                        $(function(){
                        var numberOfItems = $("#main-row .shopdiv").length;
                        var limitPerPage = 6;
                        var totalPages = Math.ceil(numberOfItems / limitPerPage)
                        var paginationSize = 7;
                        var currentPage;
                  
                        function showPage(whichPage){
                          if(whichPage < 1 || whichPage > totalPages) return false;
                  
                          currentPage = whichPage;
                  
                          $("#main-row .shopdiv").hide().removeClass("aaa").slice((currentPage - 1) *  limitPerPage, currentPage * limitPerPage).show().addClass("aaa");
                          var numItems = $("#main-row .aaa").length
                          $(".numRecord").text(numItems)
                          $(".totalRecord").text(numberOfItems)
                          $(".page-number li").slice(1, -1).remove();
                  
                          getPageList(totalPages, currentPage, paginationSize).forEach(item =>{
                            $("<li>").addClass("page-item").addClass(item ? "current-page" : "dots").toggleClass("acti", item === currentPage).append($("<a>").addClass("page-link").attr({href: "javascript:void(0"}).text(item || "...")).insertBefore(".next-page");
                          });
                  
                          $(".previous-page").toggleClass("disabled", currentPage === 1);
                          $(".next-page").toggleClass("disabled", currentPage === totalPages)
                          return true;
                        }
                        $(".page-number").append(
                          $("<li>").addClass("page-item").addClass("previous-page").append($("<a>").addClass("page-link").attr({href: "javascript:void(0)"}).text("Prev")),
                            $("<li>").addClass("page-item").addClass("next-page").append($("<a>").addClass("page-link").attr({href: "javascript:void(0)"}).text("Next"))
                          );
                  
                          $("#main-row").show();
                          showPage(1);
                  
                          $(document).on("click", ".page-number li.current-page:not(.acti)", function(){
                            return showPage(+$(this).text());
                          });
                  
                          $(".next-page").on("click", function(){
                            return showPage(currentPage + 1);
                          })
                  
                          $(".previous-page").on("click", function(){
                            return showPage(currentPage - 1);
                          })
                      })
                    })
    </script>
