<%- include('../partials/header.html') %>
<style>
    .error{
        font-size: 15px;
        margin-left: 5px;
    }
</style>
<div class="container">

    <div class="row">
        <div class="col-4"></div>
        <div class="col-8">
            <div class="mt-4" >
                <div>
                    <input type="hidden" id="customer-token" value="<%= token%>">
                    <label class="ps-2 fw-bold" style="font-size: 16px;">New password</label> <br>
                    <input type="password" id="new-password" placeholder="Enter new password" style="width: 300px; height: 35px;">
                </div>
                
                <div>
                    <label class="ps-2 fw-bold mt-3" style="font-size: 16px;">Confirm password</label><br>
                    <input type="password" id="confirm-password" placeholder="Confirm password" style="width: 300px; height: 35px;">
                </div>
                <button type="submit" class="btn btn-warning" id="change-password" style="margin-top: 20px; margin-left: 70px; font-weight: 500;">Change Password</button>
            </div>
        </div>
    </div>
</div>
<%- include('../partials/footer.html') %>

<script type="text/javascript">
     $(document).ready(function () {

        $("#change-password").click(function (){
            $(".error").hide();
            var hasError = false;
            var new_password = $("#new-password").val();
            var confirm_password = $("#confirm-password").val();
            var customer_token = $("#customer-token").val()

            if(new_password == ''){
                $("#new-password").after('<p class="error" id="error" style="color: red;">Please enter new password.</p>')
                hasError = true;
            }else if(confirm_password == ''){
                $("#confirm-password").after('<p class="error" id="error" style="color: red;">Please enter confirm password.</p>')
                hasError = true;
            }else if(new_password != confirm_password){
                $("#confirm-password").after('<p class="error" id="error" style="color: red;">Password is not matched.</p>')
                hasError = true;
            }
            if(hasError == true) { return false; }

            $.ajax({
                url: "/update-password",
                method: "post",                
                data: {
                    _csrf: '<%= _csrf %>',
                    customer_token,
                    confirm_password
                },
                success: function (data) {
                    if(data.success) {
                        toastr.error('Password is updated successfully')
                        window.location.href = '/'                        
                    }else{
                        toastr.error('Some error occurred. Password is not updated')
                    }
                }
            })
        })
     })
</script>
