<%- include('../partials/header.html') %>

    <h1>MY MENUS</h1>
<section class="section-content padding-y">
    <h1>hhhhhhh</h1>
    <div class="container">
        <div class="row">
            <aside class="col-md-3">
                
                <div class="card">
                    <article class="filter-group">
                        <header class="card-header">
                            
                            <a href="#" data-toggle="collapse" data-target="#collapse_1" aria-expanded="true" class="">
                                <i class="icon-control fa fa-chevron-down"></i>
                                <h6 class="title">Grocery</h6>
                            </a>
                        </header>
                        
                        <div class="filter-content collapse show" id="collapse_1" >
                            <div class="card-body">
                                <form class="pb-3">
                                    
                                <div class="input-group">
                                  <input type="text" class="form-control" placeholder="Search Product.." id="search-product">
                                  <div class="input-group-append">
                                    <button class="btn btn-light" type="button"><i class="fa fa-search"></i></button>
                                  </div>
                                </div>
                                </form>
                                <ul class="list-menu">
                                <li><a href="/category/grocery" slug="grocery" class="product-category">Grocery</a></li>
                                <li><a href="/category/mobiles" slug="mobiles" class="product-category">Mobiles </a></li>
                                <li><a href="/category/fashion" slug="fashion" class="product-category">Fashion  </a></li>
                                <li><a href="/category/electronics" slug="electronics" class="product-category">Electronics  </a></li>
                                 </ul>
                                </div> 
                        </div>
                    </article> 
                    <article class="filter-group">
                        <header class="card-header">
                            <a href="#" data-toggle="collapse" data-target="#collapse_3" aria-expanded="true" class="">
                                <i class="icon-control fa fa-chevron-down"></i>
                                <h6 class="title">Price range </h6>
                            </a>
                        </header>
                        <div class="filter-content collapse show" id="collapse_3" >
                            <div class="card-body">
                                <input type="range" class="custom-range" min="0" max="100" name="">
                                <div class="form-row">
                                <div class="form-group col-md-6">
                                    <label>Min</label>
                                    <input class="form-control" placeholder="Rs. 0" type="number" id="min-price">
                                </div>
                                <div class="form-group text-right col-md-6">
                                    <label>Max</label>
                                    <input class="form-control" placeholder="Rs. 1,0000" type="number" id="max-price">
                                </div>
                                </div>
                                <button class="btn btn-block btn-primary" id="apply-price-range-btn">Apply</button>
                            </div>
                        </div>
                    </article> 
                </div> 
            </aside> 
            <main class="col-md-9" id="product-list">
                
            </main> 
        </div>
    </div> 
</section>
