<style>
    .infopayment
    {
       padding-left: 20px; 
    }
    </style>
    <!-- <body> -->
        <%- include('../partials/header.html') %>
    
        <div class="container payment p-5">

           <div class="row">
            <div class="col-12 col-md-8 m-0 p-0">
               <div class="inside  bg-white">
            <h5 class="bg-primary ps-3 text-white p-0 m-0 fw-bold pb-4">Payment options:</h5>
            <div class="ps-5 infopayment bg-primary">
            <h5 class="fw-bold py-3">Select payment method: </h5>
            <div class="paymentMethod">
              <input  type="radio" value="COD" name="paymet-method" >Cash On Delivery
              <br>
              <input  type="radio" value="ONLINE" name="paymet-method" >Online Payment 
               </div> 
            <input type="radio" id="debit" name="payment-method" value="debit">
            <label>Credit/debit card</label><br>
        <!-- Card Number -->
        <div class="ps-5 border creditform border-1 w-50">
           <h6 class="fw-bold">Card details</h6>
        <input type="text" class="mt-3 card-number" placeholder="Card Number">
     
        <!-- Date Field -->
        <div class="date-field py-3">
          <div class="month">
            <select name="Month">
              <option value="january">January</option>
              <option value="february">February</option>
              <option value="march">March</option>
              <option value="april">April</option>
              <option value="may">May</option>
              <option value="june">June</option>
              <option value="july">July</option>
              <option value="august">August</option>
              <option value="september">September</option>
              <option value="october">October</option>
              <option value="november">November</option>
              <option value="december">December</option>
            </select>
          </div>
          <div class="year pt-3">
            <select name="Year">
              <option value="2016">2016</option>
              <option value="2017">2017</option>
              <option value="2018">2018</option>
              <option value="2019">2019</option>
              <option value="2020">2020</option>
              <option value="2021">2021</option>
              <option value="2022">2022</option>
              <option value="2023">2023</option>
              <option value="2024">2024</option>
            </select>
          </div>
        </div>
        <input type="text" class="card-cvv-number mb-3" placeholder="Cvv Number"><br>
        <a class="btn btn-primary" href="#" role="button">PAY</a>
        </div>
        <!-- Card Verification Field -->
            
      
              <!-- CARD DETAIL  -->
            <input type="radio" id="net-banking" name="payment-method"   value="net-banking">
            <label for="net-banking">Net-banking</label><br>
            <div class="bank-name">
              <h6 class="fw-bold">Popular banks</h6>
              <div class="px-5 allbanknames d-flex justify-content-between">
                <p>HDFC</p>
                <p>Axis</p>
                <p>Bank of baroda</p>
                <p>SBI</p>
                <a class="btn btn-primary mb-3" href="#" role="button">PAY</a>
              </div>
            </div>
            <input type="radio" id="upi" name="payment-method" value="upi">
            <label for="upi">UPI</label><br>
            <div class="UPI-detail ms-5">
            <input type="text" id="myupi" name="upi-id" placeholder="Enter upi id"> 
            <a class="btn btn-primary me-auto" href="#" role="button">PAY</a>
            </div>
            <input type="radio" id="cod" name="payment-method" value="cod">
            <label for="cod">Cash on delivery</label><br>
           
        </div>   
      </div>
    </div>
           </div>
           
        <div class="col-12 col-md-4 p-0 m-0">
          <div class="inside bg-white">
           <h5 class="bg-primary ps-3 text-white p-0 m-0 fw-bold pb-4">Price details:</h5>
           <div class="d-flex justify-content-between">
           <p class="pt-3 mb-0 ps-5">Price(1 item)</p>
           <p class="pt-3 mb-0 pe-5">300/-</p>
           </div>
           <div class="d-flex justify-content-between">
           <p class="pt-3 mb-0 ps-5">Deliver charge</p>
           <p class="pt-3 mb-0 pe-5">40/-</p>
           </div>
           <p class="fw-bold pt-3 mb-0 ps-5 pb-3">Amount payable</p>
           </div>
        </div>
        </div>  
      </div>  
    
        <div id="footer"></div>
    
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
     <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script>
            $('.home-1,.home-2,.home-3,.home-4,.home-5').hide();
    
      // var i=0;
      for(i=1;i<=17;i++){
        $('.subcat-'+i).hide();
      }
    $(document).ready(function(){
    
      $('.main-nav ul li a').hover(function(){
        var classname=$(this).attr('data-class');
        $("."+classname).fadeIn();
      },function(){
        var classname=$(this).attr('data-class');
        $("."+classname).fadeOut();
      });
      $('.drop-content').mouseover(function(){
        $(this).stop();
      });
      $('.drop-content').mouseout(function(){
        $(this).fadeOut();
      });
    
      $('.list-item ol li a').mouseover(function(){
        for(i=1;i<=17;i++){
          $('.subcat-'+i).hide();
        }
        var div=$(this).attr('data-add-content');
        $('.'+div).show();
      });
    
    });
    
    $(document).ready(function(){
        $(".creditform").hide();
         $(".bank-name").hide();
         $(".UPI-detail").hide();
        $("#debit").click(function(){
            $(".creditform").toggle();
            $(".bank-name").hide();
            $(".UPI-detail").hide();
        });
         $("#net-banking").click(function(){
            $(".bank-name").toggle();
            $(".creditform").hide();
            $(".UPI-detail").hide();
        });
         $("#upi").click(function(){
            $(".UPI-detail").toggle();
            $(".creditform").hide();
            $(".bank-name").hide();
      
        });
    
        // logged in hide-show starts
    
      $(".create-new").fadeOut();
      $(".modal-body a").click(function(){
        $(".create-new").fadeIn();
      $(".part-1-login").fadeOut();
       
      });
      // logged in hide-show ends
    
    
    
    
    
    
    
    });     
    
        
    $(function () {
       $("#footer").load("footer.html");
       $("#header").load("header.html");
     });
            
            
        
        </script>
    </body>
    </html>
