<style>
          :root{
    --nav-bck:#F24A72;
    --log-bck:#fff;
    --cart-color:#fff;
    --txt-color:#0000;
    --bg-grey:#F1F3F6;
    
}

body
{
    background-color:#F1F3F6 ;
}

.myorderbtn
{
background: #f2f2f2;
font-size: 16px;
display: inline-block;
width: 75px;
height: 33px;
color: green;
display: flex;
justify-content: center;
align-items: center;
}
#rate-product
{
    width: 172px;
}
.bs4-order-tracking {
    margin-bottom: 30px;
    overflow: hidden;
    color: #878788;
    padding-left: 0px;
    margin-top: 30px
}

.bs4-order-tracking li {
    list-style-type: none;
    font-size: 13px;
    width: 20%;
    float: left;
    position: relative;
    font-weight: 400;
    color: #878788;
    text-align: center
}

.bs4-order-tracking li:first-child:before {
    margin-left: 15px !important;
    padding-left: 11px !important;
    text-align: left !important
}

.bs4-order-tracking li:last-child:before {
    margin-right: 5px !important;
    padding-right: 11px !important;
    text-align: right !important
}

.bs4-order-tracking li>div {
    color: #fff;
    width: 23px;
    height: 23px;
    text-align: center;
    line-height: 29px;
    display: block;
    font-size: 12px;
    background: #878788;
    border-radius: 50%;
    margin: auto
    

}

/* .bs4-order-tracking li:after {
    content: '' !important;
    width: 150% !important;
    height: 2px !important;
    background: #878788 !important;
    position: absolute !important;
    left: 0% !important;
    right: 0% !important;
    top: 15px !important;
    z-index: -1 !important;
} */

.bs4-order-tracking li:first-child:after {
    left: 50%
}

.bs4-order-tracking li:last-child:after {
    left: 0% !important;
    width: 0% !important
}

.bs4-order-tracking li.active {
    font-weight: bold;
    color: green;
}

.bs4-order-tracking li.on {
    font-weight: bold;
    color: red;
}

.bs4-order-tracking li.active>div {
    background: green;
}

.bs4-order-tracking li.on>div {
    background: red;
}
.bs4-order-tracking li.active:after {
    background: green;
}
.aaaa{
    background-color: green;
}
.xxxx{
    background-color: red;
}
.yyyy{
    background-color: grey
}
.bbbb{
    background-color: grey;
}

.bs4-order-tracking li.on:after {
    background: red;
}

.card-timeline {
    background-color: #fff;
    z-index: 0;
    width:125%;
    border: none;
}
   
    form.example input[type=text] {
  padding: 8px;

}

form.example button {

  color: white;
  font-size: 14px;

  border-left: none;

}


form.example::after {
  clear: both;

}

}
.b{

}

}
.a{

}

                  </form> <br> <br>
